{% extends "base.html" %}
{% block title %}Log in — Equipment Activity Log{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  {% if form.errors %}<p class="msg error">Invalid username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Log in</button>
  </form>
</div>
{% endblock %}
