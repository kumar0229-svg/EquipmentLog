{% extends "base.html" %}
{% load static %}
{% block title %}Log in — DigiLog{% endblock %}

{% block content %}
<div class="login-layout">
  <img src="{% static 'img/facility-banner.png' %}" alt="Cipla facility" class="login-banner">
  <div class="card narrow">
    <h1>Log in</h1>
    {% if form.errors %}<p class="msg error">Invalid username or password.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="primary">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
